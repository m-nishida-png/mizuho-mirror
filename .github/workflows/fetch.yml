name: Fetch Mizuho CSV

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = JST 05:00
  workflow_dispatch:        # 手動実行ボタン用

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download CSV
        run: |
          curl -sSL --fail \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/csv,text/plain,*/*" \
            -H "Accept-Language: ja,en;q=0.9" \
            -H "Referer: https://www.mizuhobank.co.jp/market/historical/index.html" \
            -o quote.csv \
            https://www.mizuhobank.co.jp/market/quote.csv

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quote.csv
          if git diff --quiet --cached; then
            echo "No changes."
          else
            git commit -m "update quote.csv $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
